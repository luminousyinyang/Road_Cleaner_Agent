{# The hero illustration, ported from the comp: a road receding to a vanishing
   point, a camera on a pole, a scan beam sweeping down, and a detection box
   locking on. Decorative only -- nothing here is data-driven. #}
<svg viewBox="0 0 440 420" role="img" aria-label="A road ahead, with a hazard picked out by a detection box">
  <defs>
    <linearGradient id="rc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEEE8"/>
      <stop offset="100%" stop-color="#FAFAF8"/>
    </linearGradient>
    <linearGradient id="rc-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A227" stop-opacity="0"/>
      <stop offset="55%" stop-color="#D9A227" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#D9A227" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc-road-clip">
      <polygon points="150,120 290,120 430,400 10,400"/>
    </clipPath>
  </defs>

  <rect width="440" height="420" fill="url(#rc-sky)"/>

  <!-- ground + road -->
  <rect x="0" y="118" width="440" height="302" fill="#EDECE4"/>
  <polygon points="150,120 290,120 430,400 10,400" fill="#2A2A28"/>

  <!-- lane markings -->
  <g clip-path="url(#rc-road-clip)" stroke="#D9A227" stroke-width="5" stroke-linecap="round">
    <line x1="207" y1="132" x2="204" y2="158"/>
    <line x1="200" y1="180" x2="194" y2="216"/>
    <line x1="186" y1="248" x2="176" y2="298"/>
    <line x1="164" y1="336" x2="148" y2="400"/>
  </g>
  <g clip-path="url(#rc-road-clip)" stroke="#D9A227" stroke-width="5" stroke-linecap="round">
    <line x1="233" y1="132" x2="236" y2="158"/>
    <line x1="240" y1="180" x2="246" y2="216"/>
    <line x1="254" y1="248" x2="264" y2="298"/>
    <line x1="276" y1="336" x2="292" y2="400"/>
  </g>
  <g clip-path="url(#rc-road-clip)" stroke="#F2F1EA" stroke-width="4">
    <line x1="150" y1="120" x2="10" y2="400"/>
    <line x1="290" y1="120" x2="430" y2="400"/>
  </g>

  <!-- the hazard -->
  <ellipse cx="196" cy="300" rx="26" ry="11" fill="#141412"/>
  <ellipse cx="190" cy="296" rx="15" ry="7" fill="#2E2C29"/>

  <!-- signal rising from the hazard -->
  <g fill="#D9A227">
    <rect x="228" y="286" width="5" height="10" rx="2" style="animation: rc-flow 1.6s ease-in-out infinite"/>
    <rect x="238" y="278" width="5" height="18" rx="2" style="animation: rc-flow 1.6s ease-in-out .2s infinite"/>
    <rect x="248" y="268" width="5" height="28" rx="2" style="animation: rc-flow 1.6s ease-in-out .4s infinite"/>
    <rect x="258" y="256" width="5" height="40" rx="2" style="animation: rc-flow 1.6s ease-in-out .6s infinite"/>
  </g>

  <!-- scan beam -->
  <g clip-path="url(#rc-road-clip)">
    <rect x="10" y="120" width="420" height="70" fill="url(#rc-beam)"
          style="animation: rc-scan 4.2s cubic-bezier(.4,0,.2,1) infinite"/>
  </g>

  <!-- detection box locking on -->
  <g style="animation: rc-lock 4.2s ease-out infinite">
    <rect x="160" y="278" width="76" height="42" fill="none" stroke="#B4451F" stroke-width="3"
          style="animation: rc-lockpulse 1.4s ease-in-out infinite"/>
    <rect x="158" y="258" width="104" height="18" rx="3" fill="#B4451F"/>
    <text x="166" y="271" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">debris · 0.94</text>
  </g>

  <!-- camera pole -->
  <rect x="352" y="150" width="7" height="250" fill="#4A4A45"/>
  <rect x="300" y="150" width="58" height="7" fill="#4A4A45"/>
  <rect x="286" y="140" width="34" height="24" rx="4" fill="#1A1A18"/>
  <circle cx="292" cy="152" r="5" fill="#D9A227" style="animation: rc-lens 2.2s ease-in-out infinite"/>
</svg>
