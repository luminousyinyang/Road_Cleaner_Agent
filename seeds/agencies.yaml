# Rules are evaluated top to bottom; the first match wins. They run before any
# model is consulted, and in practice they resolve almost everything.
rules:
  - id: toll-facility
    description: >-
      Toll roads run their own maintenance. Check this first — it is the rule
      most often missed, because the road passes straight through a DOT
      district that has nothing to do with it.
    match:
      road_contains: ["Turnpike", "Toll", "Expressway Authority"]
    agency_by_state:
      FL: fl-turnpike

  - id: municipal-signal
    description: >-
      Signal heads and signs inside a city belong to the city, even on a state
      route. This is why a US-70 signal in Durham goes to Durham, not NCDOT.
    match:
      hazard_types: ["infrastructure_damage"]
      lane_positions: ["intersection"]
      county_in: ["Durham", "Wake", "Fulton", "Broward"]
    agency_by_county:
      Durham: durham-public-works
      Wake: raleigh-public-works
      Fulton: atlanta-public-works
      Broward: fortlauderdale-public-works

  - id: camera-owner
    description: >-
      The 511 APIs tell us who owns each camera. When they do, believe them —
      it is better information than anything we could infer.
    match:
      has_owner_agency: true
    use_camera_owner: true

  - id: interstate-mainline
    description: Interstates and US routes default to the state DOT district.
    match:
      road_prefix: ["I-", "US-", "SR-", "GA-", "FL-", "NC-"]
    use_camera_owner: true

  - id: state-dot-fallback
    # Skipped by the first pass and consulted only after the model has declined.
    # A rule that matches everything, placed in front of the reasoner, means the
    # reasoner is never asked anything.
    last_resort: true
    description: >-
      Last resort, and the one that makes a dropped pin or a dashcam work at all.
      Every rule above it selects `use_camera_owner`, and a location that came
      from a coordinate has no camera and therefore no owner -- so without this,
      anything outside the seeded GA/FL/NC cameras resolved to nobody and the
      report was held. State-maintained roads are the state DOT's unless a more
      specific rule above already claimed them.
    match:
      # Only where the location is a bare coordinate. A camera on a named road
      # that matched nothing is held, not handed to the state on the grounds
      # that it is in the state -- a private drive is not theirs.
      road_unknown: true
