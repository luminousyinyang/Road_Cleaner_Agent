# Who owns which road, and how to reach them.
#
# This registry is the part of the system with no clever answer: somebody has to
# sit down once and work out that a traffic signal on a US route inside Durham
# belongs to the city, while the pavement it stands on belongs to NCDOT. That
# knowledge is here, as data, rather than being asked of a language model every
# time -- it is stable, it is checkable, and getting it wrong means a report
# lands on the wrong desk and quietly dies.
#
# Endpoints are the agencies' **real** public reporting pages -- the same forms a
# person would use. They are here so the dashboard can show exactly where a report
# would go, rather than a placeholder that reads as unfinished work.
#
# Two things follow from that, and both matter:
#
# * Email addresses are still deliberately non-routable (`@example.invalid`). An
#   automated message landing in a real district maintenance inbox is the one
#   failure here with a person on the other end of it, and published addresses in
#   a public repository get scraped.
# * Nothing is transmitted without `DRY_RUN=false` **and** `ALLOW_LIVE_FILING=true`.
#   Two deliberate switches, because a single environment variable is not enough
#   to stand between an automated system and a government intake form.
#
# The city entries are `maintenance_form`, not `open311`: what these four publish
# is a web form for people, not a GeoReport v2 API. `Open311Channel` stays in the
# codebase for cities that do publish one.

