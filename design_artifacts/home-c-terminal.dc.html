<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
body { margin: 0; background: #FFFFFF; }
a { color: #111110; text-decoration: none; }
a:hover { color: #C2410C; }
@keyframes rw-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</helmet>
<div style="background: #FFFFFF; color: #111110; font-family: 'Geist', system-ui, sans-serif; min-width: 1080px; padding-bottom: 100px;">

  <nav style="display: flex; align-items: center; gap: 28px; padding: 18px 40px; border-bottom: 1px solid #EBEBE8;">
    <span style="font-weight: 600; font-size: 14.5px; letter-spacing: -0.02em;">RoadWarden</span>
    <div style="display: flex; gap: 20px; font-size: 13.5px;">
      <a href="#log" style="color: #111110; font-weight: 500;">Road log</a>
      <a href="roadwarden-about.dc.html" style="color: #78786F;" style-hover="color: #C2410C;">How it works</a>
    </div>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #78786F;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #15803D; animation: rw-breathe 2.4s ease-in-out infinite;"></span>on duty
    </span>
  </nav>

  <header style="padding: 72px 40px 0; max-width: 1000px;">
    <h1 style="margin: 0 0 16px; font-weight: 600; font-size: 54px; line-height: 1.05; letter-spacing: -0.042em; max-width: 18em;">Hazards get spotted. Almost none get reported.</h1>
    <p style="margin: 0; font-size: 18.5px; line-height: 1.5; color: #57574F; max-width: 34em;">This one does the reporting, then keeps watching until the road is clear.</p>
  </header>

  <section id="log" style="margin-top: 72px; padding: 0 40px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 8px; background: #F6F6F4; border-radius: 7px; padding: 3px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.select }}" style="{{ f.style }}">{{ f.label }}<span style="{{ f.countStyle }}">{{ f.count }}</span></button>
        </sc-for>
      </div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #9A9A90;">{{ summary }}</span>
    </div>

    <div style="border: 1px solid #EBEBE8; border-radius: 10px; overflow: hidden;">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="9">
        <div onClick="{{ c.open }}" style="{{ c.rowStyle }}" style-hover="background: #FAFAF9;">
          <span style="{{ c.pillStyle }}">{{ c.status }}</span>
          <div style="min-width: 0;">
            <div style="font-size: 15.5px; font-weight: 500; letter-spacing: -0.015em;">{{ c.hazard }}</div>
            <div style="font-size: 13.5px; color: #78786F; margin-top: 3px;">{{ c.location }}</div>
          </div>
          <div style="font-size: 13.5px; color: #57574F;">{{ c.agency }}</div>
          <div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #78786F;">{{ c.ref }}</div>
          <div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9A9A90; text-align: right;">{{ c.when }}</div>
          <div style="color: #C2410C; font-size: 14px; text-align: right;">→</div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
const CASES = [
  { id: "GA-4471", kind: "filed", status: "Filed", hazard: "Truck tire in lane 2", location: "I-285 WB · Camp Creek Pkwy", agency: "Georgia DOT, District 7", ref: "TMC-88213", when: "Mon 2:14p" },
  { id: "NC-1180", kind: "escalated", status: "Past due", hazard: "Standing water on the shoulder", location: "US-64 E · Tarboro Bypass", agency: "NCDOT, Division 4", ref: "MR-40118 · 2nd", when: "Sat 6:40a" },
  { id: "FL-2209", kind: "watching", status: "Watching", hazard: "Stalled car, right shoulder", location: "I-4 EB · Mile marker 78.2", agency: "Not yet resolved", ref: "held · 0.72", when: "Sat 1:07p" },
  { id: "GA-4468", kind: "cleared", status: "Cleared", hazard: "Tire tread, lane 1", location: "I-75 NB · Howell Mill Rd", agency: "Georgia DOT, District 7", ref: "TMC-88198", when: "Mon 2:02p" },
  { id: "NC-1176", kind: "filed", status: "Filed", hazard: "Guardrail torn open in the median", location: "I-40 W · Exit 293", agency: "NCDOT, Division 5", ref: "MR-40092", when: "Fri 11:22p" },
  { id: "FL-2204", kind: "suppressed", status: "Stood down", hazard: "Lane closure already in the feed", location: "I-95 SB · Atlantic Blvd", agency: "Nobody — correctly", ref: "duplicate", when: "Fri 8:55a" },
  { id: "GA-4465", kind: "watching", status: "Watching", hazard: "Deer on the northbound shoulder", location: "GA-400 NB · Holcomb Bridge", agency: "Not yet resolved", ref: "held · 0.69", when: "Fri 5:31a" },
  { id: "FL-2198", kind: "cleared", status: "Cleared", hazard: "Mattress across two lanes", location: "Florida's Turnpike · MM 263", agency: "Turnpike Enterprise", ref: "SR-771204", when: "Thu 4:12p" },
  { id: "NC-1171", kind: "filed", status: "Filed", hazard: "Signal head knocked sideways", location: "US-70 @ Miami Blvd", agency: "Durham Public Works", ref: "DUR-2026-33871", when: "Thu 7:48a" }
];

const TONE = {
  filed:      { fg: "#166534", bg: "#F0FDF4", bd: "#BBF7D0" },
  escalated:  { fg: "#9A3412", bg: "#FFF7ED", bd: "#FED7AA" },
  watching:   { fg: "#854D0E", bg: "#FEFCE8", bd: "#FEF08A" },
  cleared:    { fg: "#57574F", bg: "#F6F6F4", bd: "#E5E5E1" },
  suppressed: { fg: "#78786F", bg: "#FFFFFF", bd: "#EBEBE8" }
};

const FILTERS = [
  { key: "all", label: "All" },
  { key: "filed", label: "Filed" },
  { key: "watching", label: "Watching" },
  { key: "escalated", label: "Past due" },
  { key: "cleared", label: "Cleared" }
];

class Component extends DCLogic {
  state = { filter: "all" };

  renderVals() {
    const active = this.state.filter;
    const counts = CASES.reduce((a, c) => { a[c.kind] = (a[c.kind] || 0) + 1; return a; }, {});
    const shown = CASES.filter(c => active === "all" || c.kind === active);

    return {
      summary: shown.length + " of " + CASES.length + " cases · week of Aug 3",
      filters: FILTERS.map(f => {
        const on = f.key === active;
        return {
          label: f.label,
          count: f.key === "all" ? CASES.length : (counts[f.key] || 0),
          select: () => this.setState({ filter: f.key }),
          style: "display:inline-flex;align-items:center;gap:7px;font-family:'Geist',sans-serif;font-size:13px;font-weight:500;"
            + "padding:7px 13px;border:none;border-radius:5px;cursor:pointer;transition:background 120ms ease;"
            + (on ? "background:#FFFFFF;color:#111110;box-shadow:0 1px 2px rgba(17,17,16,0.08);" : "background:transparent;color:#78786F;"),
          countStyle: "font-family:'Geist Mono',monospace;font-size:11px;color:" + (on ? "#9A9A90" : "#B4B4AA") + ";"
        };
      }),
      cases: shown.map((c, i) => {
        const t = TONE[c.kind];
        return {
          hazard: c.hazard, location: c.location, agency: c.agency, ref: c.ref, when: c.when, status: c.status,
          open: () => {},
          rowStyle: "display:grid;grid-template-columns:104px 1fr 178px 148px 92px 20px;gap:0 20px;align-items:center;"
            + "padding:15px 18px;cursor:pointer;transition:background 120ms ease;"
            + (i > 0 ? "border-top:1px solid #F1F1EE;" : "")
            + (c.kind === "suppressed" ? "opacity:0.66;" : ""),
          pillStyle: "justify-self:start;font-family:'Geist',sans-serif;font-size:11.5px;font-weight:500;padding:4px 9px;border-radius:100px;white-space:nowrap;"
            + "color:" + t.fg + ";background:" + t.bg + ";border:1px solid " + t.bd + ";"
        };
      })
    };
  }
}
</script>
</body>
</html>
